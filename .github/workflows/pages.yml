# Publishes the app to GitHub Pages. There is no build step — the repo root
# is the site — so this just uploads it as-is.
#
# It runs on a push to whichever branch is the repository default, so it keeps
# working whether that is `main` or the branch this started life on.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Note: this step needs Pages already switched on for the repository
      # (Settings -> Pages -> Source: GitHub Actions). The action's
      # `enablement: true` option cannot do it for you — creating a Pages site
      # needs repo-admin rights that GITHUB_TOKEN is not allowed to hold.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
